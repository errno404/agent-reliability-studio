name: CI
on:
  pull_request:
  push: { branches: [main] }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
permissions: { contents: read }   # least privilege: CI never needs to write

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with: { enable-cache: true }
      - run: uv sync --python 3.13 --frozen
      - name: Lint
        run: uv run ruff format --check . && uv run ruff check .
      - name: Type check
        run: uv run pyright
      - name: Tests (evalcore coverage gate >= 85%)
        run: uv run pytest --cov=evalcore --cov-fail-under=85 -q
      - name: Agent pins are intact (frozen versions are never edited)
        env:
          BASE_REF: ${{ github.base_ref }}   # passed via env, never interpolated into the script
          EVENT: ${{ github.event_name }}
        run: |
          uv run python scripts/check_pins.py
          if [ "$EVENT" = "pull_request" ]; then uv run python scripts/check_pins.py --base "origin/$BASE_REF"; fi
      - name: Datasets validate
        run: |
          for f in datasets/support/*.yaml datasets/research/*.yaml datasets/coding/*.yaml datasets/redteam/*.yaml; do
            uv run ars dataset validate "$f"
          done
      - name: Demo seed + invariants (zero API keys)
        env: { DATABASE_URL: "sqlite:///./ci.db" }
        run: uv run ars db upgrade && uv run ars demo seed && uv run ars demo verify

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npx eslint .
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build

  e2e:
    needs: [python, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with: { enable-cache: true }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: uv sync --python 3.13 --frozen
      - run: npm ci && npm run build && npx playwright install --with-deps chrome
        working-directory: apps/web
      - name: Playwright (seeds its own API on :8100)
        run: npx playwright test
        working-directory: apps/web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with: { name: playwright-traces, path: apps/web/test-results, retention-days: 7 }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose config -q
      - run: docker build -f infra/docker/api.Dockerfile -t ars-api:ci .
      - run: docker build -f infra/docker/web.Dockerfile -t ars-web:ci .
