[project]
name = "ars-api"
version = "0.1.0"
description = "FastAPI service, SQLAlchemy persistence, worker, and the `ars` CLI."
requires-python = ">=3.13,<3.15"
dependencies = [
  "evalcore", "demo-agents", "fixture-web",
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "alembic>=1.13",
  "psycopg[binary]>=3.2", "typer>=0.12", "pydantic-settings>=2.5", "httpx>=0.27",
]

[project.scripts]
ars = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
