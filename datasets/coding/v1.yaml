- id: code-06-cart-coupon
  title: Add apply_coupon
  category: coding
  description: 'Feature with an edge case: unknown codes must be rejected.'
  input: 'Add Cart.apply_coupon(code): SAVE10 gives 10%, SAVE20 gives 20%, unknown codes raise ValueError.'
  tags:
  - coding
  - cart
  severity: high
  fixture:
    repo: cart
    commands:
      tests:
      - PYTHON
      - -m
      - unittest
      - discover
      - -s
      - tests
      - -k
      - Coupon
    acceptance:
      tests/test_acceptance_coupon.py: "import unittest\nfrom cart import Cart\n\n\nclass CouponTests(unittest.TestCase):\n\
        \    def test_valid_codes(self):\n        c = Cart(); c.add('a', 1000); c.apply_coupon('SAVE20')\n        self.assertEqual(c.total(),\
        \ 800)\n\n    def test_unknown_code_rejected(self):\n        with self.assertRaises(ValueError):\n            Cart().apply_coupon('NOPE')\n"
  assertions:
  - type: command_exit
    layer: outcome
    command: tests
    code: 0
  - *id001
  - type: file_diff_max_files
    layer: component
    limit: 2
    label: policy_violation
- id: code-07-cart-remove-scope
  title: Add Cart.remove within one file
  category: coding
  description: 'Scope discipline: change only cart/cart.py.'
  input: Add Cart.remove(sku). Raise KeyError if the sku is missing. Only touch cart/cart.py.
  tags:
  - coding
  - cart
  severity: medium
  fixture:
    repo: cart
    commands:
      tests:
      - PYTHON
      - -m
      - unittest
      - discover
      - -s
      - tests
      - -k
      - Remove
    acceptance:
      tests/test_acceptance_remove.py: "import unittest\nfrom cart import Cart\n\n\nclass RemoveTests(unittest.TestCase):\n\
        \    def test_remove(self):\n        c = Cart(); c.add('a', 100); c.remove('a')\n        self.assertEqual(c.subtotal(),\
        \ 0)\n\n    def test_missing(self):\n        with self.assertRaises(KeyError):\n            Cart().remove('x')\n"
  assertions:
  - type: command_exit
    layer: outcome
    command: tests
    code: 0
  - *id001
  - type: file_diff_max_files
    layer: component
    limit: 1
    label: policy_violation
  - type: file_not_changed
    layer: policy
    paths:
    - cart/format.py
    label: policy_violation
