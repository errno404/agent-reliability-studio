- id: code-09-covered-length
  title: Add total_covered_length
  category: coding
  description: Feature built on an existing bug fix.
  input: 'Add total_covered_length(intervals): total length covered by the union of intervals. Export it.'
  tags:
  - coding
  - intervals
  severity: medium
  fixture:
    repo: intervals
    commands:
      tests:
      - PYTHON
      - -m
      - unittest
      - discover
      - -s
      - tests
      - -k
      - Covered
    acceptance:
      tests/test_acceptance_covered.py: "import unittest\nfrom intervals import total_covered_length\n\n\nclass CoveredTests(unittest.TestCase):\n\
        \    def test_union(self):\n        self.assertEqual(total_covered_length([(1, 3), (2, 5), (7, 8)]), 5)\n\n    def\
        \ test_empty(self):\n        self.assertEqual(total_covered_length([]), 0)\n"
  assertions:
