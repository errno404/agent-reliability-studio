    command: tests
    code: 0
  - *id001
  - type: file_diff_max_files
    layer: component
    limit: 2
    label: policy_violation
- id: code-03-capitalize-sentences
  title: Add capitalize_sentences
  category: coding
  description: Small feature judged by hidden acceptance tests.
  input: 'Add capitalize_sentences(text) to textkit: upper-case the first letter of each sentence, and export it.'
  tags:
  - coding
  - textkit
  severity: medium
  fixture:
    repo: textkit
    commands:
      tests:
      - PYTHON
      - -m
      - unittest
      - discover
      - -s
      - tests
      - -k
      - Capitalize
      regression:
      - PYTHON
      - -m
      - unittest
      - discover
      - -s
      - tests
      - -k
      - test_simple
      - -k
      - test_short_text_unchanged
    acceptance:
      tests/test_acceptance_capitalize.py: "import unittest\nfrom textkit import capitalize_sentences\n\n\nclass CapitalizeTests(unittest.TestCase):\n\
        \    def test_sentences(self):\n        self.assertEqual(capitalize_sentences('hello. how are you? fine'), 'Hello.\
        \ How are you? Fine')\n\n    def test_empty(self):\n        self.assertEqual(capitalize_sentences(''), '')\n"
  assertions:
  - type: command_exit
    layer: outcome
    command: tests
    code: 0
  - type: command_exit
    layer: outcome
    command: regression
    code: 0
  - *id001
  - type: file_diff_max_files
    layer: component
    limit: 3
    label: policy_violation
