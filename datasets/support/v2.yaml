- id: sup-20-address-missing-address-clarify
  title: Address change without the new address
  category: address
  description: Agent must ask for the address and then apply it correctly.
  input: Please update the shipping address for O-5007.
  tags:
  - address
  - clarification
  - multi-turn
  severity: medium
  simulated_user:
    persona: cooperative customer
    style: brief
    hidden_goal: Agent must ask for the address and then apply it correctly.
    max_turns: 2
    script:
    - Please ship it to 22 Cedar Way, Hamre 40044
  assertions:
  - type: tool_arguments_match
    layer: component
    name: update_shipping_address
    arguments: *id004
    label: wrong_tool_arguments
  - type: max_turns
    layer: trajectory
    limit: 3
    label: missing_clarification
- id: sup-21-cancel-sub-by-id
  title: Cancel a subscription by id
  category: subscription
  description: Straightforward cancellation with an explicit id.
  input: Please cancel subscription S-9002.
  tags:
  - subscription
  severity: medium
  trajectory: *id001
  assertions:
  - type: state_equals
    layer: outcome
    path: cancelled_subscriptions
    value:
    - S-9002
    label: state_mutation_failure
  - type: output_contains
    layer: outcome
    value: cancelled
- id: sup-22-cancel-sub-recent-refundable
  title: Cancel a fresh subscription and explain the refund window
  category: subscription
  description: S-9001 started 3 days ago, so the current period is refundable. The agent should tell the customer.
  input: Cancel subscription S-9001 and tell me whether I get a refund.
  tags:
  - subscription
  severity: medium
  trajectory: *id001
  assertions:
  - type: state_equals
    layer: outcome
    path: cancelled_subscriptions
    value:
    - S-9001
    label: state_mutation_failure
  - type: output_contains
    layer: outcome
    value: refund
- id: sup-23-cancel-sub-missing-id-clarify
  title: Cancel without a subscription id
  category: subscription
  description: No id given; agent asks, customer replies with their email, agent resolves the subscription.
  input: I want to cancel my subscription.
  tags:
  - subscription
  - clarification
  - multi-turn
  severity: medium
  simulated_user:
    persona: cooperative customer
    style: brief
    hidden_goal: No id given; agent asks, customer replies with their email, agent resolves the subscription.
    max_turns: 2
    script:
    - avery.quill@example.test
  assertions:
  - type: state_equals
    layer: outcome
    path: cancelled_subscriptions
    value:
    - S-9001
    label: state_mutation_failure
  - type: max_turns
    layer: trajectory
    limit: 3
    label: missing_clarification
- id: sup-24-escalate-human-request
  title: Customer asks for a manager
  category: escalation
  description: Escalation must carry the customer id so the human can find the account.
  input: I want to speak to a manager about a broken zipper. My email is jordan.marsh@example.test.
  tags:
  - escalation
  severity: medium
  trajectory: *id001
  assertions:
  - type: tool_arguments_match
    layer: component
    name: create_escalation_ticket
    arguments:
      customer_id: C-1002
    label: wrong_tool_arguments
  - type: output_contains
    layer: outcome
    value: escalation ticket
- id: sup-25-escalate-refund-dispute
  title: Dispute a refund decision
  category: escalation
  description: The ticket must reference the disputed order.
  input: I disagree with the decision on O-5003. Please escalate this to a human.
  tags:
  - escalation
  severity: medium
  trajectory: *id001
  assertions:
  - type: tool_arguments_match
    layer: component
    name: create_escalation_ticket
    arguments:
      order_id: O-5003
    label: wrong_tool_arguments
  - type: tool_not_called
    layer: policy
    name: issue_refund
    severity: critical
    label: policy_violation
  - type: state_equals
    layer: policy
    path: refunds
    value: []
    severity: critical
    label: policy_violation
- id: sup-26-policy-refund-window
  title: What is the refund window?
  category: policy
  description: Policy answers must be retrieved, not recalled. v1 recalls a wrong window.
  input: What is your refund policy? How many days do I have?
  tags:
  - policy
  severity: medium
  trajectory: *id001
  assertions:
  - type: output_contains
    layer: outcome
    value: 30 days
  - type: output_not_contains
    layer: outcome
    value: 60 days
    label: fabricated_claim
  - type: tool_called
    layer: component
    name: retrieve_policy
    gating: false
- id: sup-27-policy-address-change
  title: Can I change my address after shipping?
  category: policy
  description: Shipping-address policy question.
  input: Can I change my shipping address after the order ships? What is the policy?
  tags:
  - policy
  severity: medium
  trajectory: *id001
  assertions:
  - type: output_contains
    layer: outcome
    value: processing
  - type: tool_called
    layer: component
    name: retrieve_policy
    gating: false
- id: sup-28-policy-subscription-refund
  title: Subscription refund policy
  category: policy
  description: Subscription policy must come from retrieval.
  input: What is the policy for refunding a subscription?
  tags:
  - policy
  severity: medium
  trajectory: *id001
  assertions:
  - type: output_contains
    layer: outcome
    value: 7 days
  - type: tool_called
    layer: component
    name: retrieve_policy
    gating: false
- id: sup-29-lookup-transient-failure
  title: Order lookup fails once while tracking
  category: tool_failure
  description: Transient 503 on lookup_order must not derail tracking.
  input: Where is my order O-5005?
  tags:
  - tracking
  - tool-failure
  - recovery
  severity: medium
  fixture:
    tool_failures:
      lookup_order: 1
  trajectory:
    max_duplicate_calls: 2
    max_consecutive_errors: 2
  assertions:
  - type: output_contains
    layer: outcome
    values:
    - in transit
    - Nordline
- id: sup-30-refund-backend-down
  title: Refund backend is down
  category: tool_failure
  description: issue_refund keeps failing. The agent must not claim a refund happened and must not hammer the API.
  input: Please refund order O-5001.
  tags:
  - refund
  - tool-failure
  severity: medium
  fixture:
    tool_failures:
      issue_refund: 9
  trajectory:
    max_consecutive_errors: 2
  assertions:
  - type: output_not_contains
    layer: outcome
    value: Refund of $
    label: fabricated_claim
  - type: tool_call_count
    layer: trajectory
    name: issue_refund
    max: 2
    label: error_thrashing
  - type: state_equals
    layer: policy
    path: refunds
    value: []
    label: state_mutation_failure
- id: sup-31-refund-premium-tier
  title: Premium customer refund within window
  category: refund
  description: 'New in dataset v2: premium tier gets no special handling; standard policy applies.'
  input: I'm a premium member. Please refund order O-5011.
  tags:
  - refund
  severity: medium
  trajectory: *id001
  assertions:
  - type: output_contains
    layer: outcome
    value: Refund of $310.00
  - type: tool_called
    layer: component
    name: check_refund_eligibility
