[project]
name = "demo-agents"
version = "0.1.0"
description = "Deterministic reference systems under test (support, research, coding) with pinned versions."
requires-python = ">=3.13,<3.15"
dependencies = ["evalcore", "langgraph>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["demo_agents"]
