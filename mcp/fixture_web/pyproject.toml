[project]
name = "fixture-web"
version = "0.1.0"
description = "Frozen, deterministic, read-only synthetic web corpus served over MCP."
requires-python = ">=3.13,<3.15"
dependencies = ["mcp>=1.20", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fixture_web"]
